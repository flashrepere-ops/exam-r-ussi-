<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAM - Réussite Totale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 1s ease-in-out;
        }
        .trophy-icon {
            font-size: 5rem;
            margin-bottom: 15px;
            animation: bounce 1.2s infinite alternate;
        }
        h1 {
            color: #f1c40f;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #bdc3c7;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .certificate-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #f1c40f;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(241, 196, 15, 0.25);
            position: relative;
            overflow: hidden;
        }
        .cert-header {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #2ecc71;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .cert-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }
        .cert-name {
            font-size: 1.2rem;
            color: #f1c40f;
            margin-bottom: 15px;
        }
        .flag-badge {
            font-size: 1.8rem;
            margin-top: 5px;
        }
        .finish-btn {
            width: 100%;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s, background 0.3s;
            margin-bottom: 10px;
        }
        .finish-btn:hover {
            background: #27ae60;
            transform: scale(1.02);
        }
        .home-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-12px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="trophy-icon">🏆</div>
        <h1>Consécration Ultime !</h1>
        <p class="subtitle">Le fruit de tes efforts, de ta rigueur et de ton travail acharné guidé par EXAM.</p>

        <div class="certificate-card">
            <div class="cert-header">EXCELLENCE AFRICAINE MOBILE</div>
            <div class="cert-title" id="cert-series-title">BAC D</div>
            <p style="font-size: 0.9rem; color: #ecf0f1; margin-bottom: 5px;">Mention : Très Bien</p>
            <div class="cert-name">🎉 Moussa</div>
            <div class="flag-badge" id="cert-flag-emoji">🇹🇬</div>
        </div>

        <button class="finish-btn" onclick="partagerSucces()">Partager ma victoire 🚀</button>
        <button class="home-btn" onclick="window.location.href='index.html'">Revenir à l'accueil 🏠</button>
    </div>

    <script>
        const savedSeries = localStorage.getItem('exam_series') || 'BAC D';
        const savedCountry = localStorage.getItem('exam_country') || 'Togo';

        document.getElementById('cert-series-title').innerText = savedSeries;

        // Attribue un drapeau selon le pays stocké
        let flag = "🇹🇬";
        if (savedCountry === "Bénin") flag = "🇧🇯";
        if (savedCountry === "Côte d'Ivoire") flag = "🇨🇮";
        if (savedCountry === "Burkina Faso") flag = "🇧🇫";
        if (savedCountry === "Ghana") flag = "🇬🇭";
        if (savedCountry === "Nigeria") flag = "🇳🇬";
        
        document.getElementById('cert-flag-emoji').innerText = flag;

        function partagerSucces() {
            alert("Félicitations Moussa ! Ton diplôme et ta réussite sont prêts à être partagés avec tes proches.");
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAM - Réussite Totale</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { text-align: center; }
        .trophy-icon { font-size: 4.5rem; margin-bottom: 15px; animation: bounce 1.2s infinite alternate; }
        h1 { color: #f1c40f; font-size: 1.6rem; margin-bottom: 8px; }
        .subtitle { color: #bdc3c7; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
        .certificate-card { background: rgba(255, 255, 255, 0.08); border: 2px solid #f1c40f; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(241, 196, 15, 0.25); position: relative; overflow: hidden; }
        .cert-header { font-size: 0.75rem; letter-spacing: 2px; color: #2ecc71; margin-bottom: 8px; font-weight: bold; }
        .cert-title { font-size: 1.3rem; font-weight: bold; color: #fff; margin-bottom: 6px; }
        .cert-name { font-size: 1.1rem; color: #f1c40f; margin-bottom: 12px; }
        .flag-badge { font-size: 1.6rem; margin-top: 5px; }
        .home-btn { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 14px; font-size: 0.95rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.3s; }
        .home-btn:hover { background: rgba(255, 255, 255, 0.2); }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="trophy-icon">🏆</div>
        <h1>Consécration Ultime !</h1>
        <p class="subtitle">Le fruit de tes efforts, de ta rigueur et de ton travail acharné guidé par EXAM.</p>
        
        <div class="certificate-card">
            <div class="cert-header">EXCELLENCE AFRICAINE MOBILE</div>
            <div class="cert-title" id="cert-series-title">BAC D</div>
            <p style="font-size: 0.85rem; color: #ecf0f1; margin-bottom: 5px;">Mention : Très Bien</p>
            <div class="cert-name">🎉 Moussa</div>
            <div class="flag-badge" id="cert-flag-emoji">🇹🇬</div>
        </div>

        <button class="btn-primary" onclick="partagerSucces()">Partager ma victoire 🚀</button>
        <button class="home-btn" onclick="window.location.href='index.html'">Revenir à l'accueil 🏠</button>
    </div>

    <script src="script.js"></script>
    <script>
        const userData = ExamApp.getUserData();
        document.getElementById('cert-series-title').innerText = userData.series;
        
        // Attribution dynamique du drapeau selon le pays choisi
        let flagsMap = {
            "Togo": "🇹🇬",
            "Bénin": "🇧🇯",
            "Côte d'Ivoire": "🇨🇮",
            "Burkina Faso": "🇧🇫",
            "Ghana": "🇬🇭",
            "Nigeria": "🇳🇬"
        };
        document.getElementById('cert-flag-emoji').innerText = flagsMap[userData.country] || "🇹🇬";

        function partagerSucces() {
            alert("Félicitations Moussa ! Ton diplôme et ta réussite sont prêts à être partagés avec tes proches.");
        }
    </script>
</body>
</html>
